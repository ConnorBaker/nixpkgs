[package]
name = "nix-cuda-policy"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = { version = "0.2", default-features = false }
rustix = { version = "=1.1.6", default-features = false, features = ["alloc", "fs", "linux_4_11"] }

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
